<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 280" role="img" aria-label="Infinite line charge with cylindrical Gaussian surface">
  <rect width="420" height="280" fill="#fafafa"/>
  <text x="210" y="24" text-anchor="middle" font-family="Figtree,Segoe UI,sans-serif" font-size="14" fill="#111">Infinite line · cylindrical Gaussian surface</text>
  <line x1="210" y1="50" x2="210" y2="240" stroke="#e85d4c" stroke-width="3"/>
  <text x="222" y="60" font-size="12" fill="#e85d4c">λ</text>
  <ellipse cx="210" cy="80" rx="70" ry="18" fill="none" stroke="#0d6e6e" stroke-width="2"/>
  <ellipse cx="210" cy="210" rx="70" ry="18" fill="none" stroke="#0d6e6e" stroke-width="2"/>
  <line x1="140" y1="80" x2="140" y2="210" stroke="#0d6e6e" stroke-width="2"/>
  <line x1="280" y1="80" x2="280" y2="210" stroke="#0d6e6e" stroke-width="2"/>
  <line x1="210" y1="145" x2="280" y2="145" stroke="#888" stroke-dasharray="3 3"/>
  <text x="245" y="138" font-size="12" fill="#555">r</text>
  <text x="210" y="265" text-anchor="middle" font-size="12" fill="#555">E = λ/(2πε0 r)</text>
</svg>
