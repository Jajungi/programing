<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 280" role="img" aria-label="Test charge on the perpendicular bisector of plus and minus Q">
  <rect width="420" height="280" fill="#fafafa"/>
  <text x="210" y="24" text-anchor="middle" font-family="Figtree,Segoe UI,sans-serif" font-size="14" fill="#111">Test charge on the bisector of ±Q</text>
  <circle cx="120" cy="180" r="14" fill="#e85d4c"/><text x="120" y="185" text-anchor="middle" font-size="12" fill="#fff">+Q</text>
  <circle cx="300" cy="180" r="14" fill="#3a7bd5"/><text x="300" y="185" text-anchor="middle" font-size="12" fill="#fff">-Q</text>
  <line x1="120" y1="180" x2="300" y2="180" stroke="#888"/>
  <text x="210" y="200" text-anchor="middle" font-size="11" fill="#555">d</text>
  <circle cx="210" cy="80" r="12" fill="#111"/><text x="210" y="84" text-anchor="middle" font-size="11" fill="#fff">q</text>
  <line x1="210" y1="180" x2="210" y2="92" stroke="#0d6e6e" stroke-dasharray="4 3"/>
  <text x="222" y="140" font-size="11" fill="#0d6e6e">x</text>
  <line x1="120" y1="180" x2="210" y2="80" stroke="#ccc"/><line x1="300" y1="180" x2="210" y2="80" stroke="#ccc"/>
</svg>
