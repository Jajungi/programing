<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 240" role="img" aria-label="Three parallel charged sheets">
  <rect width="420" height="240" fill="#fafafa"/>
  <text x="210" y="22" text-anchor="middle" font-family="Figtree,Segoe UI,sans-serif" font-size="13" fill="#111">Three parallel charged sheets</text>
  <rect x="60" y="50" width="300" height="8" fill="#e85d4c"/><text x="370" y="58" font-size="11">+σ · y=0</text>
  <rect x="60" y="110" width="300" height="8" fill="#3a7bd5"/><text x="370" y="118" font-size="11">−2σ · y=d</text>
  <rect x="60" y="170" width="300" height="8" fill="#e85d4c"/><text x="370" y="178" font-size="11">+σ · y=2d</text>
  <text x="210" y="220" text-anchor="middle" font-size="12">superpose E · integrate for V(y)</text>
</svg>
