<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 240" role="img" aria-label="Electric dipole in uniform E">
  <rect width="420" height="240" fill="#fafafa"/>
  <text x="210" y="22" text-anchor="middle" font-family="Figtree,Segoe UI,sans-serif" font-size="13" fill="#111">Electric dipole in uniform E</text>
  <g stroke="#e67e22" stroke-width="2">
    <line x1="60" y1="70" x2="360" y2="70"/><line x1="60" y1="110" x2="360" y2="110"/>
    <line x1="60" y1="150" x2="360" y2="150"/><line x1="60" y1="190" x2="360" y2="190"/>
  </g>
  <circle cx="180" cy="130" r="12" fill="#e85d4c"/><text x="180" y="134" text-anchor="middle" font-size="10" fill="#fff">+</text>
  <circle cx="260" cy="130" r="12" fill="#3a7bd5"/><text x="260" y="134" text-anchor="middle" font-size="10" fill="#fff">−</text>
  <line x1="180" y1="130" x2="260" y2="130" stroke="#111" stroke-width="2"/>
  <text x="220" y="120" text-anchor="middle" font-size="12">p</text>
  <text x="210" y="225" text-anchor="middle" font-size="12">τ = p × E · U = −p·E</text>
</svg>
