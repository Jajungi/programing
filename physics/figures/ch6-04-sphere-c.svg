<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 220" role="img" aria-label="Isolated sphere capacitance">
  <rect width="420" height="220" fill="#fafafa"/>
  <text x="210" y="22" text-anchor="middle" font-family="Figtree,Segoe UI,sans-serif" font-size="13" fill="#111">Isolated sphere capacitance</text>
  <circle cx="180" cy="120" r="50" fill="none" stroke="#111" stroke-width="3"/>
  <text x="180" y="125" text-anchor="middle" font-size="12">R</text>
  <text x="300" y="120" font-size="14">C = 4πε0 R</text>
  <text x="210" y="195" text-anchor="middle" font-size="12" fill="#555">isolated sphere in free space</text>
</svg>
