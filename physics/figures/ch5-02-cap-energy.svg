<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 220" role="img" aria-label="Energy in a parallel-plate capacitor">
  <rect width="420" height="220" fill="#fafafa"/>
  <text x="210" y="22" text-anchor="middle" font-family="Figtree,Segoe UI,sans-serif" font-size="13" fill="#111">Energy in a parallel-plate capacitor</text>
  <rect x="120" y="50" width="14" height="140" fill="#e85d4c"/>
  <rect x="250" y="50" width="14" height="140" fill="#3a7bd5"/>
  <text x="210" y="120" text-anchor="middle" font-size="13">U = ½ C V²</text>
  <text x="210" y="150" text-anchor="middle" font-size="12" fill="#555">= ½ QV = Q²/(2C)</text>
