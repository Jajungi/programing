<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 220" role="img" aria-label="Assembling two point charges">
  <rect width="420" height="220" fill="#fafafa"/>
  <text x="210" y="22" text-anchor="middle" font-family="Figtree,Segoe UI,sans-serif" font-size="13" fill="#111">Assembling two point charges</text>
  <circle cx="120" cy="120" r="14" fill="#e85d4c"/><text x="120" y="125" text-anchor="middle" font-size="11" fill="#fff">q1</text>
  <circle cx="300" cy="120" r="14" fill="#3a7bd5"/><text x="300" y="125" text-anchor="middle" font-size="11" fill="#fff">q2</text>
  <line x1="134" y1="120" x2="286" y2="120" stroke="#888"/>
  <text x="210" y="110" text-anchor="middle" font-size="12">r</text>
  <text x="210" y="180" text-anchor="middle" font-size="13">U = k q1 q2 / r</text>
</svg>
