  <rect x="30" y="50" width="130" height="50" rx="8" fill="#fff" stroke="#111"/><text x="95" y="80" text-anchor="middle" font-size="12">rate law</text>
  <rect x="185" y="50" width="130" height="50" rx="8" fill="#fff" stroke="#111"/><text x="250" y="80" text-anchor="middle" font-size="12">order</text>
