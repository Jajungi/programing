<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 200" role="img" aria-label="Acid–base definitions">
  <rect width="500" height="200" fill="#fafafa"/>
  <text x="250" y="22" text-anchor="middle" font-family="Figtree,Segoe UI,sans-serif" font-size="13" fill="#111">Acid–base definitions</text>
  <rect x="30" y="50" width="140" height="110" rx="8" fill="#fff" stroke="#111"/><text x="100" y="85" text-anchor="middle" font-size="12" font-weight="700">Arrhenius</text><text x="100" y="115" text-anchor="middle" font-size="11">H+ / OH− in water</text>
  <rect x="180" y="50" width="140" height="110" rx="8" fill="#fff" stroke="#111"/><text x="250" y="85" text-anchor="middle" font-size="12" font-weight="700">Brønsted</text><text x="250" y="115" text-anchor="middle" font-size="11">H+ donor / acceptor</text>
  <rect x="330" y="50" width="140" height="110" rx="8" fill="#fff" stroke="#111"/><text x="400" y="85" text-anchor="middle" font-size="12" font-weight="700">Lewis</text><text x="400" y="115" text-anchor="middle" font-size="11">e− pair acc. / don.</text>
</svg>
