  <rect width="420" height="180" fill="#fafafa"/>
  <text x="210" y="22" text-anchor="middle" font-family="Figtree,Segoe UI,sans-serif" font-size="13" fill="#111">Writing Kc</text>
  <rect x="60" y="55" width="300" height="80" rx="10" fill="#fff" stroke="#111"/>
