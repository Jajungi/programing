<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 220" role="img" aria-label="Doubling solvent and solute mass">
  <rect width="480" height="220" fill="#fafafa"/>
  <text x="240" y="22" text-anchor="middle" font-family="Figtree,Segoe UI,sans-serif" font-size="13" fill="#111">Doubling solvent and solute mass</text>
  <rect x="50" y="60" width="140" height="120" rx="8" fill="#dceef8" stroke="#111"/>
  <text x="120" y="125" text-anchor="middle" font-size="12">solution</text>
  <text x="120" y="200" text-anchor="middle" font-size="11" fill="#555">m_solute · m_solvent</text>
  <text x="240" y="120" text-anchor="middle" font-size="28" fill="#0d6e6e">→ ×2</text>
  <rect x="290" y="50" width="150" height="140" rx="8" fill="#cfe8f5" stroke="#111"/>
  <text x="365" y="125" text-anchor="middle" font-size="12">same ratio</text>
  <text x="365" y="210" text-anchor="middle" font-size="11" fill="#555">2m · 2m · concentration?</text>
</svg>
