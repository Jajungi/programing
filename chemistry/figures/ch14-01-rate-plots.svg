<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" role="img" aria-label="Linear plots for zero, first, and second order reactions">
  <rect width="640" height="240" fill="#fafafa"/>
  <text x="320" y="24" text-anchor="middle" font-family="Figtree,Segoe UI,sans-serif" font-size="14" fill="#111">Linear forms of integrated rate laws</text>
  <g transform="translate(30,45)">
    <rect width="180" height="170" fill="#fff" stroke="#e5e5e5"/>
    <text x="90" y="22" text-anchor="middle" font-size="12" fill="#111">(a) zero order · [A] vs t</text>
    <line x1="30" y1="140" x2="160" y2="140" stroke="#111"/>
    <line x1="30" y1="140" x2="30" y2="40" stroke="#111"/>
    <line x1="40" y1="55" x2="145" y2="125" stroke="#0d6e6e" stroke-width="2.5"/>
    <text x="95" y="160" text-anchor="middle" font-size="11" fill="#555">slope = -k</text>
  </g>
  <g transform="translate(230,45)">
    <rect width="180" height="170" fill="#fff" stroke="#e5e5e5"/>
    <text x="90" y="22" text-anchor="middle" font-size="12" fill="#111">(b) first order · ln[A] vs t</text>
    <line x1="30" y1="140" x2="160" y2="140" stroke="#111"/>
    <line x1="30" y1="140" x2="30" y2="40" stroke="#111"/>
    <line x1="40" y1="50" x2="145" y2="120" stroke="#0d6e6e" stroke-width="2.5"/>
    <text x="95" y="160" text-anchor="middle" font-size="11" fill="#555">slope = -k</text>
  </g>
  <g transform="translate(430,45)">
    <rect width="180" height="170" fill="#fff" stroke="#e5e5e5"/>
    <text x="90" y="22" text-anchor="middle" font-size="12" fill="#111">(c) second order · 1/[A] vs t</text>
    <line x1="30" y1="140" x2="160" y2="140" stroke="#111"/>
    <line x1="30" y1="140" x2="30" y2="40" stroke="#111"/>
    <line x1="40" y1="115" x2="145" y2="50" stroke="#0d6e6e" stroke-width="2.5"/>
    <text x="95" y="160" text-anchor="middle" font-size="11" fill="#555">slope = +k</text>
  </g>
</svg>
