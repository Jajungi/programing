<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 200" role="img" aria-label="Mass percent of solution">
  <rect width="420" height="200" fill="#fafafa"/>
  <text x="210" y="22" text-anchor="middle" font-family="Figtree,Segoe UI,sans-serif" font-size="13" fill="#111">Mass percent of solution</text>
  <rect x="80" y="50" width="260" height="110" rx="8" fill="#fff" stroke="#111"/>
  <rect x="80" y="50" width="70" height="110" fill="#fde8d8"/>
  <text x="115" y="110" text-anchor="middle" font-size="12">solute</text>
  <text x="250" y="110" text-anchor="middle" font-size="12">solvent</text>
  <text x="210" y="185" text-anchor="middle" font-size="12">mass % = (m_solute / m_total) × 100</text>
</svg>
