<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 220" role="img" aria-label="Pressure effect on gas equilibrium">
  <rect width="420" height="220" fill="#fafafa"/>
  <text x="210" y="22" text-anchor="middle" font-family="Figtree,Segoe UI,sans-serif" font-size="13" fill="#111">Pressure effect on gas equilibrium</text>
  <rect x="70" y="70" width="100" height="110" fill="#dceef8" stroke="#111"/>
  <rect x="70" y="55" width="100" height="20" fill="#bbb" stroke="#111"/>
  <text x="120" y="130" text-anchor="middle" font-size="11">more volume</text>
