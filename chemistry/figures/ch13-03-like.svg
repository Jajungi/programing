<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 220" role="img" aria-label="Like dissolves like">
  <rect width="480" height="220" fill="#fafafa"/>
  <text x="240" y="22" text-anchor="middle" font-family="Figtree,Segoe UI,sans-serif" font-size="13" fill="#111">Like dissolves like</text>
  <rect x="40" y="55" width="180" height="130" rx="10" fill="#fff" stroke="#111"/>
  <text x="130" y="85" text-anchor="middle" font-size="13" font-weight="700">polar solvent</text>
  <circle cx="90" cy="130" r="18" fill="#3a7bd5"/><text x="90" y="134" text-anchor="middle" font-size="10" fill="#fff">δ+</text>
  <circle cx="160" cy="130" r="18" fill="#e85d4c"/><text x="160" y="134" text-anchor="middle" font-size="10" fill="#fff">δ−</text>
  <text x="130" y="175" text-anchor="middle" font-size="11" fill="#0d6e6e">dissolves polar / ionic</text>
  <rect x="260" y="55" width="180" height="130" rx="10" fill="#fff" stroke="#111"/>
  <text x="350" y="85" text-anchor="middle" font-size="13" font-weight="700">nonpolar solvent</text>
  <circle cx="320" cy="130" r="16" fill="#bbb"/><circle cx="380" cy="130" r="16" fill="#bbb"/>
  <text x="350" y="175" text-anchor="middle" font-size="11" fill="#0d6e6e">dissolves nonpolar</text>
</svg>
